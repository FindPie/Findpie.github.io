<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ page.title | escape }} · Findpie</title><style>
:root{--bg:#f8f7f3;--text:#292e2b;--muted:#787d75;--line:#dedfd7;--accent:#536b4c}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:30px}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.85}a{color:inherit;text-decoration:none}a:hover{color:var(--accent)}a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:6px}.wrap{max-width:900px;margin:auto;padding:0 36px}header{display:flex;align-items:center;justify-content:space-between;padding:32px 0;border-bottom:1px solid var(--line)}.brand{font-family:Georgia,serif;font-size:27px;font-weight:bold;letter-spacing:-1px}nav{display:flex;gap:26px;font-size:14px;color:var(--muted)}.hero{padding:54px 0 38px;position:relative}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--accent);font-weight:650}h1{font-size:clamp(40px,7vw,62px);font-weight:550;line-height:1.3;letter-spacing:3px;margin:22px 0}p{margin:14px 0}.intro{font-size:16px;color:var(--muted);max-width:440px}.sprout{position:absolute;right:35px;top:65px;width:96px;height:110px;opacity:.7}.section-title{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px}h2{font-size:17px;font-weight:600;margin:0}.small{font-size:12px;color:var(--muted)}.post{padding:16px 0;border-bottom:1px solid var(--line)}.meta{font-size:12px;color:var(--muted);letter-spacing:.4px}h3{font-size:24px;font-weight:550;margin:9px 0}.excerpt{color:var(--muted);font-size:15px}.read{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}section{margin-bottom:58px}details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}.article{max-width:650px;padding-top:15px;font-size:15px}.article p{margin:20px 0}.article blockquote{margin:24px 0;padding:8px 20px;border-left:2px solid var(--accent);color:var(--accent)}.about{display:grid;grid-template- .article{margin:48px auto 70px;max-width:700px;font-size:16px}.article h1{font-size:32px;letter-spacing:0}.article h2{font-size:24px;margin:32px 0 14px}.article h3{font-size:20px}.article img{max-width:100%}.article pre{overflow:auto;padding:16px;background:#eeeee7}.article a{color:var(--accent);text-decoration:underline}
